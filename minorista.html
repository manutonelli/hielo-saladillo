<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hielo Saladillo — Minorista</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0B0F2E;
      --navy2:   #161A45;
      --ice:     #7DD3F0;
      --ice-lt:  #E8F7FD;
      --white:   #FAFCFF;
      --gray-1:  #F3F5F9;
      --gray-2:  #DDE3EE;
      --gray-3:  #9AA3BA;
      --text:    #0B0F2E;
      --success: #22C55E;
      --danger:  #EF4444;
      --display: 'Plus Jakarta Sans', sans-serif;
      --body:    'Plus Jakarta Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--body); background: var(--white); color: var(--text); overflow-x: hidden; }
    #root { min-height: 100dvh; display: flex; flex-direction: column; }

    /* ─── HERO ─── */
    .hero {
      position: relative; background: var(--navy);
      padding: 24px 20px 28px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .hero-noise {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      opacity: 0.5; pointer-events: none;
    }
    .hero-frost {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 110% 20%, rgba(125,211,240,0.18) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 50% at -10% 80%, rgba(125,211,240,0.10) 0%, transparent 60%);
    }
    .hero-logo {
      width: 110px; position: relative; z-index: 1;
    }
    .hero-tagline {
      font-size: 13px; color: rgba(255,255,255,.5); font-weight: 500;
      position: relative; z-index: 1; margin-top: 6px;
    }
    .hero-corner {
      position: absolute; bottom: 0; right: 0;
      font-size: 100px; line-height: 1; opacity: .04; pointer-events: none; user-select: none;
    }

    /* ─── STICKY HEADER (after hero) ─── */
    .sticky-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,252,255,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-2);
      padding: 0 20px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sticky-logo { height: 32px; width: auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .mode-pill {
      display: flex; background: var(--gray-1); border-radius: 6px;
      border: 1px solid var(--gray-2); overflow: hidden;
    }
    .mode-pill button {
      padding: 6px 12px; border: none; background: none; cursor: pointer;
      font-family: var(--body); font-size: 12px; font-weight: 600; color: var(--gray-3);
      transition: all .15s;
    }
    .mode-pill button.active { background: var(--navy); color: #fff; }
    .cart-btn {
      position: relative; width: 42px; height: 42px;
      background: var(--navy); color: #fff; border: none; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; transition: background .15s, transform .1s;
    }
    .cart-btn:hover { background: var(--navy2); }
    .cart-btn:active { transform: scale(.93); }
    .cart-badge {
      position: absolute; top: -5px; right: -5px;
      background: var(--ice); color: var(--navy);
      font-size: 10px; font-weight: 800;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--white);
    }

    /* ─── CATALOG ─── */
    .catalog { flex: 1; padding: 24px 16px 140px; max-width: 540px; margin: 0 auto; width: 100%; }

    .brand-tabs {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
      margin-bottom: 28px; scrollbar-width: none;
    }
    .brand-tabs::-webkit-scrollbar { display: none; }
    .brand-tab {
      flex-shrink: 0; padding: 7px 14px; border: 1.5px solid var(--gray-2); border-radius: 4px;
      background: var(--white); font-family: var(--body); font-size: 13px; font-weight: 600;
      color: var(--gray-3); cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .brand-tab.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .brand-tab:not(.active):hover { border-color: var(--navy); color: var(--navy); }

    .brand-header {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;
    }
    .brand-name { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--text); }
    .brand-count { font-size: 12px; color: var(--gray-3); font-weight: 500; }
    .brand-divider { height: 1px; background: var(--gray-2); margin-bottom: 28px; }

    /* ─── PRODUCT CARD ─── */
    .products { display: flex; flex-direction: column; gap: 1px; margin-bottom: 0; }
    .product-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid var(--gray-2);
      transition: background .1s;
    }
    .product-row:last-child { border-bottom: none; }
    .product-row.in-cart .prod-name { color: var(--navy); }
    .product-row.out-of-stock { opacity: .45; }
    .prod-img {
      width: 56px; height: 56px; border-radius: 4px; flex-shrink: 0;
      background: var(--ice-lt); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; position: relative;
    }
    .prod-img img { width: 100%; height: 100%; object-fit: cover; }
    .prod-img-ph {
      width: 100%; height: 100%; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        -45deg, var(--ice-lt) 0px, var(--ice-lt) 5px, var(--gray-2) 5px, var(--gray-2) 10px
      );
    }
    .prod-info { flex: 1; min-width: 0; }
    .prod-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 4px; text-wrap: balance; }
    .prod-price { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--navy); }
    .prod-stock { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; margin-top: 4px; }
    .prod-stock.ok { background: #DCFCE7; color: #15803D; }
    .prod-stock.low { background: #FEF9C3; color: #A16207; }
    .prod-stock.none { background: #FEE2E2; color: #B91C1C; }
    .qty-ctrl { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
    .qty-btn {
      width: 30px; height: 30px; border: 1.5px solid var(--gray-2);
      background: var(--white); cursor: pointer; font-size: 16px; font-weight: 700;
      font-family: var(--body); display: flex; align-items: center; justify-content: center;
      transition: all .1s; color: var(--text);
    }
    .qty-btn:first-child { border-radius: 4px 0 0 4px; }
    .qty-btn:last-child { border-radius: 0 4px 4px 0; background: var(--navy); color: #fff; border-color: var(--navy); }
    .qty-btn:first-child:hover:not(:disabled) { background: var(--gray-1); }
    .qty-btn:last-child:hover:not(:disabled) { background: var(--navy2); }
    .qty-btn:disabled { opacity: .3; cursor: not-allowed; }
    .qty-num {
      width: 34px; height: 30px; border-top: 1.5px solid var(--gray-2); border-bottom: 1.5px solid var(--gray-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--text); background: #fff;
    }

    /* ─── STICKY BOTTOM BAR ─── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
      background: var(--navy); color: #fff;
      padding: 0 16px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: transform .25s, opacity .25s;
      box-shadow: 0 -4px 24px rgba(11,15,46,0.25);
    }
    .bottom-bar.hidden { transform: translateY(80px); opacity: 0; pointer-events: none; }
    .bottom-bar-left { display: flex; flex-direction: column; }
    .bottom-bar-items { font-size: 13px; font-weight: 600; opacity: .7; }
    .bottom-bar-price { font-family: var(--display); font-size: 20px; font-weight: 800; }
    .bottom-bar-action {
      display: flex; align-items: center; gap: 8px;
      background: var(--ice); color: var(--navy);
      padding: 11px 18px; border-radius: 4px;
      font-family: var(--display); font-size: 14px; font-weight: 800;
    }

    /* ─── CONTACT SECTION ─── */
    .contact-section {
      background: var(--navy); color: #fff;
      padding: 48px 24px 60px;
    }
    .contact-inner {
      max-width: 540px; margin: 0 auto;
      display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap;
    }
    .contact-bottom-text { flex: 1; min-width: 200px; }
    .contact-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--ice); margin-bottom: 10px; }
    .contact-title { font-family: var(--display); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .contact-sub { font-size: 14px; opacity: .55; margin-bottom: 16px; line-height: 1.6; }
    .contact-address { font-size: 14px; color: rgba(255,255,255,.45); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    .wa-link {
      display: inline-flex; align-items: center; gap: 10px;
      background: #25D366; color: #fff;
      padding: 16px 28px; border-radius: 4px;
      font-family: var(--display); font-size: 16px; font-weight: 800;
      text-decoration: none; transition: background .15s, transform .1s;
    }
    .wa-link:hover { background: #1DB954; }
    .wa-link:active { transform: scale(.97); }
    .map-wrap {
      width: 200px; height: 180px; flex-shrink: 0;
      overflow: hidden; border-radius: 8px;
    }
    .map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .contact-footer { margin-top: 32px; font-size: 12px; opacity: .3; }

    /* ─── CART DRAWER ─── */
    .overlay { position: fixed; inset: 0; background: rgba(11,15,46,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .22s; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .cart-drawer {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 540px; background: var(--white);
      border-radius: 16px 16px 0 0; z-index: 201;
      max-height: 92dvh; display: flex; flex-direction: column;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -8px 40px rgba(11,15,46,0.2);
    }
    .cart-drawer.open { transform: translateX(-50%) translateY(0); }
    .drawer-handle { width: 36px; height: 4px; background: var(--gray-2); border-radius: 2px; margin: 12px auto 0; }
    .drawer-header { padding: 14px 20px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--gray-1); flex-shrink: 0; }
    .drawer-title { font-family: var(--display); font-size: 18px; font-weight: 800; }
    .drawer-close { width: 30px; height: 30px; border: 1.5px solid var(--gray-2); border-radius: 4px; background: var(--white); cursor: pointer; font-size: 14px; color: var(--gray-3); display: flex; align-items: center; justify-content: center; }
    .drawer-body { overflow-y: auto; flex: 1; padding: 8px 20px; }
    .drawer-empty { text-align: center; padding: 48px 20px; color: var(--gray-3); }
    .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray-1); }
    .cart-item:last-child { border-bottom: none; }
    .ci-img { width: 44px; height: 44px; background: var(--ice-lt); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
    .ci-img img { width: 100%; height: 100%; object-fit: cover; }
    .ci-info { flex: 1; }
    .ci-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .ci-qty { font-size: 12px; color: var(--gray-3); margin-top: 2px; }
    .ci-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .ci-price { font-family: var(--display); font-size: 15px; font-weight: 800; color: var(--navy); }
    .ci-remove { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--gray-3); padding: 0; line-height: 1; transition: color .15s; }
    .ci-remove:hover { color: var(--danger); }
    .drawer-footer { padding: 14px 20px 20px; flex-shrink: 0; border-top: 1px solid var(--gray-1); }
    .total-rows { margin-bottom: 14px; }
    .tr { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-3); font-weight: 500; padding: 2px 0; }
    .tr.grand { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--navy); border-top: 1px solid var(--gray-2); padding-top: 10px; margin-top: 6px; }
    .delivery-pills { display: flex; gap: 6px; margin-bottom: 12px; }
    .del-pill { flex: 1; padding: 10px; border: 1.5px solid var(--gray-2); border-radius: 4px; background: var(--white); font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--gray-3); cursor: pointer; transition: all .15s; text-align: center; }
    .del-pill.active { border-color: var(--navy); color: var(--navy); background: var(--ice-lt); }
    .name-field { width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-2); border-radius: 4px; font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--text); outline: none; margin-bottom: 12px; transition: border-color .15s; }
    .name-field:focus { border-color: var(--navy); }
    .send-btn { width: 100%; padding: 16px; border: none; border-radius: 4px; background: #25D366; color: #fff; font-family: var(--display); font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .1s; box-shadow: 0 2px 12px rgba(37,211,102,0.35); }
    .send-btn:hover { background: #1DB954; }
    .send-btn:active { transform: scale(.98); }

    /* ─── FADE IN ─── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .4s ease both; }
    .fade-up-1 { animation-delay: .05s; }
    .fade-up-2 { animation-delay: .12s; }
    .fade-up-3 { animation-delay: .2s; }

    /* PIN MODAL */
    .modal-bd { position: fixed; inset: 0; background: rgba(11,15,46,0.6); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #fff; border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 320px; }
    .modal-title { font-family: var(--display); font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--gray-3); margin-bottom: 20px; }
    .pin-in { width: 100%; padding: 14px; border-radius: 6px; border: 1.5px solid var(--gray-2); font-family: var(--body); font-size: 22px; font-weight: 700; text-align: center; letter-spacing: 6px; outline: none; margin-bottom: 12px; transition: border-color .15s; }
    .pin-in:focus { border-color: var(--navy); }
    .pin-err { font-size: 13px; color: var(--danger); font-weight: 600; text-align: center; margin-bottom: 10px; }
    .mbtn { width: 100%; padding: 13px; border: none; border-radius: 6px; background: var(--navy); color: #fff; font-family: var(--display); font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
    .mbtn.sec { background: var(--gray-1); color: var(--gray-3); }

    @media (max-width: 400px) { .catalog { padding-inline: 12px; } }

    /* ─── ADMIN PANEL ─── */
    .admin-overlay { position: fixed; inset: 0; background: var(--white); z-index: 400; display: flex; flex-direction: column; overflow: hidden; }
    .admin-top { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .admin-top-title { font-family: var(--display); font-size: 16px; font-weight: 800; color: #fff; flex: 1; }
    .admin-close { background: rgba(255,255,255,0.12); border: none; border-radius: 6px; width: 32px; height: 32px; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .admin-body { flex: 1; overflow-y: auto; padding: 16px; max-width: 600px; width: 100%; margin: 0 auto; }
    .admin-add-btn { width: 100%; padding: 12px; border: 1.5px dashed var(--gray-2); border-radius: 6px; background: none; color: var(--navy); font-family: var(--body); font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 20px; transition: all .15s; }
    .admin-add-btn:hover { border-color: var(--navy); background: var(--ice-lt); }
    .admin-prod-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--gray-1); }
    .admin-prod-img { width: 44px; height: 44px; background: var(--ice-lt); border-radius: 4px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .admin-prod-img img { width: 100%; height: 100%; object-fit: cover; }
    .admin-prod-info { flex: 1; min-width: 0; }
    .admin-prod-code { font-size: 10px; font-weight: 700; color: var(--gray-3); text-transform: uppercase; letter-spacing: 1px; }
    .admin-prod-name { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-prod-prices { font-size: 11px; color: var(--gray-3); margin-top: 2px; }
    .admin-prod-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .admin-action-btn { padding: 5px 10px; border-radius: 4px; border: 1.5px solid var(--gray-2); background: var(--white); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--text); font-family: var(--body); }
    .admin-action-btn:hover { border-color: var(--navy); color: var(--navy); }
    .admin-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ─── PRODUCT FORM MODAL ─── */
    .form-modal-bd { position: fixed; inset: 0; background: rgba(11,15,46,0.55); z-index: 500; display: flex; align-items: flex-end; justify-content: center; }
    .form-modal { background: var(--white); border-radius: 16px 16px 0 0; width: 100%; max-width: 540px; max-height: 90dvh; display: flex; flex-direction: column; }
    .form-modal-header { padding: 14px 20px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--gray-1); flex-shrink: 0; }
    .form-modal-title { font-family: var(--display); font-size: 16px; font-weight: 800; }
    .form-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .form-row { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--gray-3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-2); border-radius: 6px; font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--text); outline: none; transition: border-color .15s; background: var(--white); }
    .form-input:focus { border-color: var(--navy); }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .form-photo-area { border: 1.5px dashed var(--gray-2); border-radius: 6px; padding: 14px; text-align: center; cursor: pointer; transition: all .15s; }
    .form-photo-area:hover { border-color: var(--navy); background: var(--ice-lt); }
    .form-photo-preview { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; margin: 0 auto 8px; display: block; }
    .form-footer { padding: 12px 20px 20px; border-top: 1px solid var(--gray-1); display: flex; gap: 8px; flex-shrink: 0; }
    .form-save-btn { flex: 1; padding: 13px; border: none; border-radius: 6px; background: var(--navy); color: #fff; font-family: var(--display); font-size: 14px; font-weight: 800; cursor: pointer; transition: background .15s; }
    .form-save-btn:hover { background: var(--navy2); }
    .form-cancel-btn { padding: 13px 20px; border: 1.5px solid var(--gray-2); border-radius: 6px; background: var(--white); color: var(--gray-3); font-family: var(--body); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .form-cancel-btn:hover { border-color: var(--navy); color: var(--navy); }
    .admin-tabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--gray-2); margin-bottom: 16px; }

function ProductForm({ product, onSave, onCancel }) {
  const isNew = !product;
  const [form, setForm] = useState(product ? {...product} : {
    id:'', name:'', retail:0, mayor:0, stock:99, brand:'helados', photo:''
  });
  const fileRef = useRef();

  function set(k,v) { setForm(f=>({...f,[k]:v})); }

  function handlePhoto(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 500;
        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        set('photo', canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function submit() {
    if (!form.id.trim() || !form.name.trim()) { alert('Código y nombre son obligatorios.'); return; }
    onSave({ ...form, id:form.id.trim().toUpperCase(), name:form.name.trim(),
      retail:parseInt(form.retail)||0, mayor:parseInt(form.mayor)||0, stock:parseInt(form.stock)||0 });
  }

  return (
    <div className="form-modal-bd">
      <div className="form-modal">
        <div className="form-modal-header">
          <div className="form-modal-title">{isNew?'+ Nuevo producto':'Editar producto'}</div>
          <button className="drawer-close" onClick={onCancel}>✕</button>
        </div>
        <div className="form-body">
          <div className="form-row">
            <label className="form-label">Código</label>
            <input className="form-input" value={form.id} onChange={e=>set('id',e.target.value)}
              disabled={!isNew} placeholder="Ej: DN33" style={!isNew?{background:'var(--gray-1)'}:{}} />
          </div>
          <div className="form-row">
            <label className="form-label">Nombre</label>
            <input className="form-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Nombre del producto" />
          </div>
          <div className="form-grid2">
            <div>
              <label className="form-label">Precio Minorista</label>
              <input className="form-input" type="number" min="0" value={form.retail} onChange={e=>set('retail',e.target.value)} />
            </div>
            <div>
              <label className="form-label">Precio Mayorista</label>
              <input className="form-input" type="number" min="0" value={form.mayor} onChange={e=>set('mayor',e.target.value)} />
            </div>
          </div>
          <div className="form-grid2">
            <div>
              <label className="form-label">Stock</label>
              <input className="form-input" type="number" min="0" value={form.stock} onChange={e=>set('stock',e.target.value)} />
            </div>
            <div>
              <label className="form-label">Categoría</label>
              <select className="form-input" value={form.brand} onChange={e=>set('brand',e.target.value)}>
                <option value="helados">Helados</option>
                <option value="hielo">Hielo</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <label className="form-label">Foto</label>
            <div className="form-photo-area" onClick={()=>fileRef.current.click()}>
              {form.photo
                ? <img src={form.photo} alt="" className="form-photo-preview" />
                : <div style={{color:'var(--gray-3)',fontSize:13,padding:'10px 0'}}>📷 Subir foto</div>}
              <div style={{fontSize:11,color:'var(--gray-3)',marginTop:4}}>JPG, PNG · se guarda en el CSV</div>
            </div>
            <input type="file" accept="image/*" ref={fileRef} style={{display:'none'}} onChange={handlePhoto} />
            {form.photo && (
              <button style={{marginTop:6,fontSize:12,color:'var(--danger)',background:'none',border:'none',cursor:'pointer',padding:0}}
                onClick={()=>set('photo','')}>✕ Quitar foto</button>
            )}
          </div>
        </div>
        <div className="form-footer">
          <button className="form-cancel-btn" onClick={onCancel}>Cancelar</button>
          <button className="form-save-btn" onClick={submit}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

function OrdersPanel({ pin }) {
  const [orders, setOrders] = useState(null);
  const [cancelling, setCancelling] = useState(null);
  const [msg, setMsg] = useState(null);

  useEffect(()=>{
    fetch('/api/orders', { headers: { 'x-admin-pin': pin } })
      .then(r=>r.json()).then(setOrders).catch(()=>setOrders([]));

  async function handleCancel(id) {
    if (!confirm('¿Cancelar este pedido y restaurar el stock?')) return;
    setCancelling(id);
    try {
      const r = await fetch('/api/orders', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-admin-pin': pin },
        body: JSON.stringify({ id }),
      });
      const data = await r.json();
      if (data.ok) {
        setOrders(prev => prev.map(o => o.id===id ? {...o, status:'cancelado'} : o));
        setMsg(data.driveError ? `Cancelado, pero error en Drive: ${data.driveError}` : '✓ Pedido cancelado y stock restaurado');
      } else {
        setMsg(`Error: ${data.error}`);
      }
    } catch(e) { setMsg('Error de red'); }
    setCancelling(null);
    setTimeout(()=>setMsg(null), 4000);
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }

  if (!orders) return <div style={{padding:32,textAlign:'center',color:'var(--gray-3)',fontSize:13}}>Cargando pedidos…</div>;
  if (!orders.length) return <div style={{padding:32,textAlign:'center',color:'var(--gray-3)',fontSize:13}}>No hay pedidos registrados.</div>;

  return (
    <div>
      {msg && <div style={{background:'#F0FDF4',border:'1.5px solid #86EFAC',borderRadius:6,padding:'10px 12px',marginBottom:12,fontSize:13,color:'#15803D',fontWeight:600}}>{msg}</div>}
      {orders.map(o=>(
        <div key={o.id} className={`order-card ${o.status}`}>
          <div className="order-header">
            <div>
              <div className="order-name">{o.name || 'Sin nombre'}</div>
              <div className="order-meta">{fmtDate(o.createdAt)} · {o.mode?.toUpperCase()} · {o.delivery==='delivery'?`Delivery${o.address?` — ${o.address}`:''}` : 'Retiro en local'}</div>
            </div>
            <span className={`order-badge ${o.status}`}>{o.status}</span>
          </div>
          <div className="order-items">{o.items.map(i=>`${i.name} ×${i.qty}`).join(' · ')}</div>
          <div className="order-footer">
            <div className="order-total">{fmtARS(o.total)}</div>
            {o.status==='confirmado' && (
              <button className="order-cancel-btn" disabled={cancelling===o.id} onClick={()=>handleCancel(o.id)}>
                {cancelling===o.id ? 'Cancelando…' : 'Cancelar pedido'}
              </button>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminPanel({ products, serverMode, onClose, onUpdate }) {
  const [tab, setTab] = useState('productos');
  const [editId, setEditId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [saved, setSaved] = useState(false);
  const [saveError, setSaveError] = useState(null);

  function notify(result) {
    if (!result || result.ok) {
      setSaveError(null); setSaved(true);
      setTimeout(()=>setSaved(false), 2500);
    } else {
      setSaved(false);
      setSaveError(result.error || 'Error al guardar');
      setTimeout(()=>setSaveError(null), 5000);
    }
  }

  function handleEdit(updated) {
    onUpdate(products.map(p=>p.id===updated.id?updated:p), notify);
    setEditId(null);
  }
  function handleAdd(product) {
    if (products.find(p=>p.id===product.id)) { alert(`Ya existe un producto con código ${product.id}.`); return; }
    onUpdate([...products, product], notify);
    setAdding(false);
  }
  function handleDelete(id) {
    if (!confirm(`¿Eliminar el producto ${id}?`)) return;
    onUpdate(products.filter(p=>p.id!==id), notify);
  }
  function handleToggleVisible(id) {
    onUpdate(products.map(p=>p.id===id?{...p,visible:p.visible===false?true:false}:p), notify);
  }

  return (
    <div className="admin-overlay">
      <div className="admin-top">
        <div className="admin-top-title">⚙️ Administrador</div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          {!serverMode && <span style={{fontSize:11,color:'#FCD34D',fontWeight:600}}>Sin servidor</span>}
          {saved && <span style={{fontSize:12,color:'#86EFAC',fontWeight:600}}>✓ Guardado</span>}
          {saveError && <span style={{fontSize:12,color:'#FCA5A5',fontWeight:600}}>✗ {saveError}</span>}
          <button className="admin-close" onClick={onClose}>✕</button>
        </div>
      </div>
      <div className="admin-body">
        <div className="admin-tabs">
          <button className={`admin-tab ${tab==='productos'?'active':''}`} onClick={()=>setTab('productos')}>Productos</button>
          <button className={`admin-tab ${tab==='pedidos'?'active':''}`} onClick={()=>setTab('pedidos')}>Pedidos</button>
        </div>
        {tab==='pedidos' && <OrdersPanel pin={ADMIN_PIN} />}
        {tab==='productos' && <>
        {!serverMode && (
          <div style={{background:'#FEF3C7',border:'1.5px solid #FCD34D',borderRadius:6,padding:'10px 12px',marginBottom:16,fontSize:13,color:'#92400E'}}>
            ⚠️ Servidor no detectado. Los cambios no se guardarán en el CSV. Ejecutá <code>node server.js</code> para activar el modo persistente.
          </div>
        )}
        <button className="admin-add-btn" onClick={()=>setAdding(true)}>+ Agregar producto</button>
        {products.map(p=>(
          <div className="admin-prod-row" key={p.id} style={p.visible===false?{opacity:.45}:{}}>
            <div className="admin-prod-img">
              {p.photo
                ? <img src={p.photo} alt="" />
                : <span style={{fontSize:20}}>{p.brand==='hielo'?'🧊':'🍦'}</span>}
            </div>
            <div className="admin-prod-info">
              <div className="admin-prod-code">{p.id}{p.visible===false&&<span style={{marginLeft:6,fontSize:9,background:'#FEE2E2',color:'#B91C1C',padding:'1px 5px',borderRadius:3,fontWeight:700}}>OCULTO</span>}</div>
              <div className="admin-prod-name">{p.name}</div>
              <div className="admin-prod-prices">Min: {fmtARS(p.retail)} · May: {fmtARS(p.mayor)} · Stock: {p.stock}</div>
            </div>
            <div className="admin-prod-actions">
              <button className="admin-action-btn" title={p.visible===false?'Mostrar':'Ocultar'} onClick={()=>handleToggleVisible(p.id)}>{p.visible===false?'👁':'🚫'}</button>
              <button className="admin-action-btn" onClick={()=>setEditId(p.id)}>Editar</button>
              <button className="admin-action-btn danger" onClick={()=>handleDelete(p.id)}>🗑</button>
            </div>
          </div>
        ))}
        </>}
      </div>
      {editId && <ProductForm product={products.find(p=>p.id===editId)} onSave={handleEdit} onCancel={()=>setEditId(null)} />}
      {adding && <ProductForm product={null} onSave={handleAdd} onCancel={()=>setAdding(false)} />}
    </div>
  );
}

function App() {
  const [products, setProducts] = useState([]);
  const [serverMode, setServerMode] = useState(false);
  const [loading, setLoading] = useState(true);
  const [mode] = useState("minorista");
  const [brand, setBrand] = useState("todos");
  const [quantities, setQuantities] = useState({});
  const [cartOpen, setCartOpen] = useState(false);
  const [showPin, setShowPin] = useState(()=>window.location.hash==="#admin");
  const [showAdmin, setShowAdmin] = useState(false);

  useEffect(()=>{
    const onHash = () => { if (window.location.hash === '#admin') setShowPin(true); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(()=>{
    fetch('/api/products')
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(data=>{ setProducts(data&&data.length?data:DEFAULT_PRODUCTS); setServerMode(true); })
      .catch(()=>setProducts(DEFAULT_PRODUCTS))
      .finally(()=>setLoading(false));
  },[]);

  async function updateProducts(next, onResult) {
    setProducts(next);
    if (serverMode) { const r = await saveToServer(next); if (onResult) onResult(r); }
  }

  function getPrice(p) { return mode==="mayorista"?p.mayor:p.retail; }
  function add(id) {
    const p=products.find(x=>x.id===id);
    if(!p||(quantities[id]||0)>=p.stock) return;
    setQuantities(q=>({...q,[id]:(q[id]||0)+1}));
  }
  function remove(id) { setQuantities(q=>({...q,[id]:Math.max((q[id]||0)-1,0)})); }
  function removeAll(id) { setQuantities(q=>({...q,[id]:0})); }

  const visible = useMemo(()=>products.filter(p=>p.visible!==false),[products]);
  const filtered = useMemo(()=>{
    if(brand==="todos") return visible;
    if(brand==="hielo") return visible.filter(p=>p.brand==="hielo");
    if(brand==="helados") return visible.filter(p=>p.brand!=="hielo");
    return visible;
  },[brand,visible]);

  const cart = useMemo(()=>
    products.filter(p=>(quantities[p.id]||0)>0).map(p=>({product:p,qty:quantities[p.id],price:getPrice(p)}))
  ,[quantities,mode,products]);

  const totalItems = cart.reduce((s,i)=>s+i.qty,0);
  const totalPrice = cart.reduce((s,i)=>s+i.price*i.qty,0);

  const grouped = useMemo(()=>{
    if(brand!=="todos") return [{brandId:brand,items:filtered}];
    return [
      {brandId:"hielo",items:visible.filter(p=>p.brand==="hielo")},
      {brandId:"helados",items:visible.filter(p=>p.brand!=="hielo")},
    ];
  },[filtered,brand,visible]);

  const brandLabel = {hielo:"Hielo",helados:"Helados"};

  if(loading) return (
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--navy)'}}>
      <div style={{color:'rgba(255,255,255,.6)',fontSize:14,fontWeight:600}}>Cargando catálogo…</div>
    </div>
  );

  return (
    <>
      <section className="hero">
        <div className="hero-noise" />
        <div className="hero-frost" />
        <div className="hero-corner">🧊</div>
        <img src="logo-white.png" alt="Hielo Saladillo" className="hero-logo fade-up" />
        <div className="hero-tagline fade-up fade-up-1">Precios minoristas · Saladillo</div>
      </section>

      <div className="sticky-header">
        <img src="logo.png" alt="Hielo Saladillo" className="sticky-logo" />
        <div className="header-right">
          <button className="cart-btn" onClick={()=>setCartOpen(true)}>
            🛒{totalItems>0&&<span className="cart-badge">{totalItems}</span>}
          </button>
        </div>
      </div>

      <section className="catalog" id="catalog">
        <div className="brand-tabs">
          {BRANDS.map(b=>(
            <button key={b.id} className={`brand-tab ${brand===b.id?"active":""}`} onClick={()=>setBrand(b.id)}>{b.label}</button>
          ))}
        </div>
        {grouped.map(({brandId,items})=>(
          <div key={brandId}>
            {brand==="todos" && (
              <div className="brand-header">
                <div className="brand-name">{brandLabel[brandId]||brandId}</div>
                <div className="brand-count">{items.length} productos</div>
              </div>
            )}
            <div className="products">
              {items.map(p=>(
                <ProductRow key={p.id} product={p} qty={quantities[p.id]||0}
                  onAdd={()=>add(p.id)} onRemove={()=>remove(p.id)} mode={mode} />
              ))}
            </div>
            {brand==="todos" && <div className="brand-divider" />}
          </div>
        ))}
      </section>

      <section className="contact-section">
        <div className="contact-inner">
          <div className="contact-bottom-text">
            <div className="contact-eyebrow">Contacto</div>
            <div className="contact-title">¿Necesitás más info?</div>
            <div className="contact-sub">Escribinos y te respondemos a la brevedad.<br/>También podés hacer tu pedido desde el catálogo.</div>
            <div className="contact-address">📍 Reynoso 3296 (esq. Mitre) · Saladillo</div>
            <a className="wa-link" href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Escribirnos por WhatsApp
            </a>
          </div>
          <div className="map-wrap">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3243.1468099406948!2d-59.768086324040574!3d-35.624107112101804!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bde0b8a7aaec4b%3A0x18aeb0bbceed33af!2sEmiliano%20Reynoso%203296%2C%20Saladillo%2C%20Provincia%20de%20Buenos%20Aires!5e0!3m2!1ses!2sar!4v1777384130146!5m2!1ses!2sar"
              loading="lazy" referrerPolicy="no-referrer-when-downgrade" allowFullScreen />
          </div>
        </div>
        <div className="contact-footer">© {new Date().getFullYear()} Hielo Saladillo · Saladillo, Buenos Aires</div>
      </section>

      <div className={`bottom-bar ${totalItems===0?"hidden":""}`} onClick={()=>setCartOpen(true)}>
        <div className="bottom-bar-left">
          <div className="bottom-bar-items">{totalItems} producto{totalItems!==1?"s":""}</div>
          <div className="bottom-bar-price">{fmtARS(totalPrice)}</div>
        </div>
        <div className="bottom-bar-action">Ver pedido →</div>
      </div>

      <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart} mode={mode}
        onRemove={removeAll} onSend={()=>{ setQuantities({}); setCartOpen(false); }} />

      {showAdmin && (
        <AdminPanel products={products} serverMode={serverMode}
          onClose={()=>setShowAdmin(false)} onUpdate={updateProducts} />
      )}

      {showPin && (
        <PinModal
          onSuccess={()=>{ setShowPin(false); setShowAdmin(true); window.location.hash=""; }}
          onCancel={()=>{ setShowPin(false); window.location.hash=""; }}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
