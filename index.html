<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hielo Saladillo</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #0B0F2E;
      --ice:   #7DD3F0;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      opacity: .5;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 110% 15%, rgba(125,211,240,0.2) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at -10% 85%, rgba(125,211,240,0.12) 0%, transparent 60%);
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 360px;
      padding: 0 24px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }
    .logo {
      width: 140px; height: auto;
      margin-bottom: 10px;
      animation: fadeUp .5s ease both;
    }
    .tagline {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,.45);
      letter-spacing: .3px;
      margin-bottom: 48px;
      animation: fadeUp .5s .07s ease both;
    }
    .btn-group {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      animation: fadeUp .5s .15s ease both;
    }
    .btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 18px 22px;
      border-radius: 8px; border: none; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px; font-weight: 800;
      text-decoration: none;
      transition: transform .12s, filter .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-mayorista { background: var(--ice); color: var(--navy); }
    .btn-mayorista:hover { filter: brightness(1.06); }
    .btn-minorista {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.14);
    }
    .btn-minorista:hover { background: rgba(255,255,255,0.13); }
    .btn-label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .btn-sub { font-size: 11px; font-weight: 500; opacity: .6; }
    .btn-arrow { font-size: 18px; opacity: .6; flex-shrink: 0; }
    .footer {
      position: relative; z-index: 1;
      margin-top: 48px;
      font-size: 12px; color: rgba(255,255,255,.2);
      animation: fadeUp .5s .25s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo-white.png" alt="Hielo Saladillo" class="logo" />
    <div class="tagline">Distribuidora de hielo y helados · Saladillo</div>
    <div class="btn-group">
      <a class="btn btn-mayorista" href="/mayorista">
        <div class="btn-label">
          <span>Catálogo Mayorista</span>
          <span class="btn-sub">Comercios y bares</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a class="btn btn-minorista" href="/minorista">
        <div class="btn-label">
          <span>Catálogo Minorista</span>
          <span class="btn-sub">Clientes particulares</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
    </div>
  </div>
  <div class="footer">© 2025 Hielo Saladillo · Reynoso 3296, Saladillo</div>
</body>
</html>
